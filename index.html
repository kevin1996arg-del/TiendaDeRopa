<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiendaDeRopa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>TiendaDeRopa</h1>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Productos</a>
            <a href="#">Contacto</a>
        </nav>
    </header>
    <section class="hero">
        <h2>Colección 2026</h2>
        <p>Descubrí las últimas tendencias en moda urbana y clásica.</p>
    </section>
    <section class="productos">
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Remera" alt="Remera">
            <h3>Remera Clásica</h3>
            <p>$15.000</p>
            <button>Agregar al carrito</button>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Jeans" alt="Jeans">
            <h3>Jeans Slim</h3>
            <p>$32.000</p>
            <button>Agregar al carrito</button>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Campera" alt="Campera">
            <h3>Campera Urbana</h3>
            <p>$58.000</p>
            <button>Agregar al carrito</button>
        </div>
    </section>
    <footer>
        <p>&copy; 2026 TiendaDeRopa - kevin1996arg-del</p>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
